  <text x="10" y="20" font-size="8">hello plotter</text>
  <image x="30" y="30" width="30" height="20" href="data:image/png;base64,iVBORw0KGgo="/>
  <defs>
    <linearGradient id="g1"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <marker id="m1" markerWidth="4" markerHeight="4"><path d="M0,0 L4,2 L0,4 z" fill="black"/></marker>
    <clipPath id="c1"><rect x="0" y="0" width="50" height="40"/></clipPath>
